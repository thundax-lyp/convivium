- id: agent-preset-registry
  config:
    default: standard
- insert:
    - id: preset-convivium-arxiv-research-analyst
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: convivium-arxiv-research-analyst
        plugins:
          - id: composition
            name: '@deepseek-ai/cordis-plugin-include'
            config:
              path: !!js "process.getBuiltinModule('node:url').pathToFileURL(process.getBuiltinModule('node:path').join(process.env.CONVIVIUM_MEETING_ROLES_ROOT, 'presets', 'convivium-arxiv-research-analyst', 'agent.cordis.yml')).href"
    - id: preset-convivium-domain-architect
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: convivium-domain-architect
        plugins:
          - id: composition
            name: '@deepseek-ai/cordis-plugin-include'
            config:
              path: !!js "process.getBuiltinModule('node:url').pathToFileURL(process.getBuiltinModule('node:path').join(process.env.CONVIVIUM_MEETING_ROLES_ROOT, 'presets', 'convivium-domain-architect', 'agent.cordis.yml')).href"
    - id: preset-convivium-github-research-analyst
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: convivium-github-research-analyst
        plugins:
          - id: composition
            name: '@deepseek-ai/cordis-plugin-include'
            config:
              path: !!js "process.getBuiltinModule('node:url').pathToFileURL(process.getBuiltinModule('node:path').join(process.env.CONVIVIUM_MEETING_ROLES_ROOT, 'presets', 'convivium-github-research-analyst', 'agent.cordis.yml')).href"
    - id: preset-convivium-manager
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: convivium-manager
        plugins:
          - id: composition
            name: '@deepseek-ai/cordis-plugin-include'
            config:
              path: !!js "process.getBuiltinModule('node:url').pathToFileURL(process.getBuiltinModule('node:path').join(process.env.CONVIVIUM_MEETING_ROLES_ROOT, 'presets', 'convivium-manager', 'agent.cordis.yml')).href"
    - id: preset-convivium-protocol-ui-engineer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: convivium-protocol-ui-engineer
        plugins:
          - id: composition
            name: '@deepseek-ai/cordis-plugin-include'
            config:
              path: !!js "process.getBuiltinModule('node:url').pathToFileURL(process.getBuiltinModule('node:path').join(process.env.CONVIVIUM_MEETING_ROLES_ROOT, 'presets', 'convivium-protocol-ui-engineer', 'agent.cordis.yml')).href"
    - id: preset-convivium-runtime-engineer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: convivium-runtime-engineer
        plugins:
          - id: composition
            name: '@deepseek-ai/cordis-plugin-include'
            config:
              path: !!js "process.getBuiltinModule('node:url').pathToFileURL(process.getBuiltinModule('node:path').join(process.env.CONVIVIUM_MEETING_ROLES_ROOT, 'presets', 'convivium-runtime-engineer', 'agent.cordis.yml')).href"
    - id: preset-convivium-verification-reviewer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: convivium-verification-reviewer
        plugins:
          - id: composition
            name: '@deepseek-ai/cordis-plugin-include'
            config:
              path: !!js "process.getBuiltinModule('node:url').pathToFileURL(process.getBuiltinModule('node:path').join(process.env.CONVIVIUM_MEETING_ROLES_ROOT, 'presets', 'convivium-verification-reviewer', 'agent.cordis.yml')).href"
- id: convivium
  config:
    provider: spawn
    maxParticipants: 8
    initialContributorRoleIds:
      - github_research_analyst
      - arxiv_research_analyst
    agentDefinitions: !!js "JSON.parse(process.getBuiltinModule('node:fs').readFileSync(process.getBuiltinModule('node:path').join(process.env.CONVIVIUM_MEETING_ROLES_ROOT, 'definitions.json'), 'utf8')).definitions"
