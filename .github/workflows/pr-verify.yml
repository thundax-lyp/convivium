name: PR Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify governance structure
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            AGENTS.md
            README.md
            TODO.md
            .github/pull_request_template.md
            docs/AGENTS.md
            docs/00-governance/ARCHITECTURE.md
            docs/00-governance/COMMIT-RULES.md
            docs/00-governance/DOCUMENT-RULES.md
            docs/00-governance/PR-RULES.md
            docs/00-governance/TODO-RULES.md
          )

          for required_file in "${required_files[@]}"; do
            test -s "$required_file"
          done

          required_directories=(
            docs/00-governance
            docs/10-requirements
            docs/20-interfaces
            docs/30-designs
            docs/40-readiness
            docs/50-operations
            docs/60-human
          )

          for required_directory in "${required_directories[@]}"; do
            test -d "$required_directory"
          done

          test ! -d docs/50-prompts

      - name: Verify pull request diff formatting
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
