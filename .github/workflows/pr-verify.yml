name: PR Verify

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify governance structure
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            AGENTS.md
            README.md
            TODO.md
            .github/pull_request_template.md
            docs/AGENTS.md
            docs/00-governance/ARCHITECTURE.md
            docs/00-governance/COMMIT-RULES.md
            docs/00-governance/DOCUMENT-RULES.md
            docs/00-governance/PR-RULES.md
            docs/00-governance/TODO-RULES.md
          )

          for required_file in "${required_files[@]}"; do
            test -s "$required_file"
          done

          required_directories=(
            docs/00-governance
            docs/10-requirements
            docs/20-interfaces
            docs/30-designs
            docs/40-readiness
            docs/50-operations
            docs/60-human
          )

          for required_directory in "${required_directories[@]}"; do
            test -d "$required_directory"
          done

          test ! -d docs/50-prompts

      - name: Verify pull request diff formatting
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  plugin-typecheck:
    name: Plugin Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: plugin/pnpm-lock.yaml

      - name: Install plugin dependencies
        working-directory: plugin
        run: pnpm install --frozen-lockfile

      - name: Run plugin typecheck
        working-directory: plugin
        run: pnpm typecheck

  plugin-format:
    name: Plugin Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: plugin/pnpm-lock.yaml

      - name: Install plugin dependencies
        working-directory: plugin
        run: pnpm install --frozen-lockfile

      - name: Check plugin formatting
        working-directory: plugin
        run: pnpm format:check

  plugin-lint:
    name: Plugin Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: plugin/pnpm-lock.yaml

      - name: Install plugin dependencies
        working-directory: plugin
        run: pnpm install --frozen-lockfile

      - name: Lint plugin sources
        working-directory: plugin
        run: pnpm lint

  plugin-test:
    name: Plugin Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: plugin/pnpm-lock.yaml

      - name: Install plugin dependencies
        working-directory: plugin
        run: pnpm install --frozen-lockfile

      - name: Run plugin tests
        working-directory: plugin
        run: pnpm test

  plugin-build:
    name: Plugin Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: plugin/pnpm-lock.yaml

      - name: Install plugin dependencies
        working-directory: plugin
        run: pnpm install --frozen-lockfile

      - name: Build plugin bundles
        working-directory: plugin
        run: pnpm build

      - name: Upload plugin build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-build
          path: plugin/lib

  package-contract:
    name: Package Contract
    runs-on: ubuntu-latest
    needs: plugin-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: plugin/pnpm-lock.yaml

      - name: Install plugin dependencies
        working-directory: plugin
        run: pnpm install --frozen-lockfile

      - name: Download plugin build artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-build
          path: plugin/lib

      - name: Verify package contract
        working-directory: plugin
        run: pnpm verify:package
